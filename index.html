<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Расселение · Дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg-app:#f4f7fb;--bg-card:#ffffff;--bg-elev:#f1f5f9;--bg-hover:#e7eef5;--bg-subtle:#f8fafc;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --text-primary:#0f172a;--text-secondary:#475569;--text-soft:#64748b;--text-muted:#94a3b8;
  --accent:#0891b2;--accent-dark:#0e7490;--accent-soft:#ecfeff;--accent-mid:#cffafe;
  --success:#059669;--success-soft:#d1fae5;
  --danger:#dc2626;--danger-soft:#fee2e2;
  --warn:#d97706;--warn-soft:#fef3c7;
  --info:#2563eb;--info-soft:#dbeafe;
  --r-sm:6px;--r:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 12px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12),0 4px 8px rgba(15,23,42,.04);
  --font-mono:'JetBrains Mono',monospace;--font-display:'Manrope',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg-app);color:var(--text-primary);
  font-family:var(--font-mono);font-size:13px;line-height:1.5;
  font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(ellipse 800px 400px at top right,rgba(8,145,178,.05),transparent 60%),
    radial-gradient(ellipse 600px 300px at top left,rgba(99,102,241,.04),transparent 60%);
  background-attachment:fixed}
.shell{max-width:1500px;margin:0 auto;padding:24px 22px 60px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;
  margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.title-block{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);font-weight:700}
h1{font-family:var(--font-display);font-size:clamp(22px,4vw,30px);font-weight:800;
  color:var(--text-primary);letter-spacing:-.025em}
h1 span{color:var(--accent)}
.meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.meta-item .value{color:var(--text-secondary);font-weight:700}
.spinner{width:14px;height:14px;border:2px solid var(--border-strong);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px rgba(8,145,178,.18);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.75)}}
.btn{border:none;border-radius:var(--r-sm);padding:7px 14px;font-family:var(--font-display);
  font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;
  transition:all .15s;color:#fff}
.btn-accent{background:var(--accent);box-shadow:0 2px 6px rgba(8,145,178,.3)}
.btn-accent:hover{background:var(--accent-dark);box-shadow:0 4px 12px rgba(8,145,178,.4)}
.btn-success{background:var(--success);box-shadow:0 2px 6px rgba(5,150,105,.3)}
.btn-success:hover{background:#047857;box-shadow:0 4px 12px rgba(5,150,105,.4)}
.btn-danger{background:var(--danger);box-shadow:0 2px 6px rgba(220,38,38,.3)}
.btn-danger:hover{background:#b91c1c;box-shadow:0 4px 12px rgba(220,38,38,.4)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

#error-bar{display:none;align-items:center;gap:10px;padding:11px 16px;
  background:var(--danger-soft);border:1px solid #fca5a5;border-radius:var(--r);
  color:#991b1b;font-size:12px;margin-bottom:18px}
#error-bar.visible{display:flex}
#error-bar.info{background:#e2f5e9;border-color:#86d9a8;color:#116638}
#error-bar .ml-auto{margin-left:auto;color:#b91c1c;opacity:.8}
#error-bar.info .ml-auto{color:#116638}

.kpi-grid{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.kpi-card{position:relative;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-card.clickable{cursor:pointer;user-select:none}
.kpi-card.clickable:hover{border-color:var(--c-accent,var(--accent))}
.kpi-card.active{border-color:var(--c-accent,var(--accent));background:var(--bg-elev);
  box-shadow:0 0 0 2px var(--c-accent,var(--accent)) inset,var(--shadow)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--c-accent,var(--accent));border-radius:var(--r) 0 0 var(--r)}
.kpi-label{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-soft);margin-bottom:9px;font-weight:700}
.kpi-card.tight{padding-left:10px;padding-right:10px}
.kpi-value{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3vw,29px);
  color:var(--text-primary);line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi-unit{font-family:var(--font-display);font-size:.5em;color:var(--text-soft);font-weight:600;margin-left:4px}
.kpi-value2{margin-top:2px}
.kpi-sub{margin-top:7px;font-size:11px;color:var(--text-soft);font-family:var(--font-display);font-weight:500}
.kpi-sub b{color:var(--c-accent,var(--accent));font-weight:700}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-sm);padding:18px 20px}
.card-title{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-soft);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .em{color:var(--accent)}

.filter-panel{padding:16px 20px;margin-bottom:18px;overflow:visible!important;position:relative;z-index:500}
.filter-row-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-section-label{font-family:var(--font-display);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted);font-weight:700}

.dropdown{position:relative;display:inline-block}
.dropdown-trigger{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 12px 8px 14px;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--text-primary);
  cursor:pointer;transition:all .12s;min-width:170px;justify-content:space-between}
.dropdown-trigger:hover{border-color:var(--border-strong);background:var(--bg-hover)}
.dropdown.open .dropdown-trigger{border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 3px var(--accent-mid)}
.dropdown.has-selection .dropdown-trigger{border-color:var(--accent);color:var(--accent-dark)}
.dropdown-label-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.dropdown-label-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown-badge{background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;
  font-size:10px;font-weight:700;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.dropdown-badge[hidden]{display:none}
.dropdown-arrow{font-size:9px;color:var(--text-muted);transition:transform .15s;flex-shrink:0}
.dropdown.open .dropdown-arrow{transform:rotate(180deg);color:var(--accent)}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-height:420px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-lg);z-index:9999;display:none;flex-direction:column;overflow:hidden}
.dropdown.open .dropdown-panel{display:flex}
.dropdown-search{padding:10px;border-bottom:1px solid var(--border)}
.dropdown-search input{width:100%;background:var(--bg-subtle);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 11px;font-family:var(--font-mono);font-size:12px;
  color:var(--text-primary);outline:none;transition:all .15s}
.dropdown-search input:focus{border-color:var(--accent);background:#fff}
.dropdown-options{overflow:auto;flex:1;padding:4px 0;scrollbar-width:thin}
.dropdown-options::-webkit-scrollbar{width:6px}
.dropdown-options::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.dropdown-option{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;
  padding:7px 14px;cursor:pointer;font-size:12px;transition:background .1s;user-select:none}
.dropdown-option:hover{background:var(--bg-elev)}
.dropdown-option .checkmark{width:16px;height:16px;border:1.5px solid var(--border-strong);
  border-radius:4px;display:flex;align-items:center;justify-content:center;color:transparent;
  font-size:11px;font-weight:700;transition:all .1s;flex-shrink:0}
.dropdown-option.selected .checkmark{background:var(--accent);border-color:var(--accent);color:#fff}
.dropdown-option .label{color:var(--text-primary);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-family:var(--font-mono)}
.dropdown-option .count{color:var(--text-muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.dropdown-empty{padding:24px 16px;text-align:center;color:var(--text-muted);font-size:12px}
.dropdown-footer{padding:8px 14px;border-top:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;background:var(--bg-subtle)}
.dropdown-clear{background:none;border:none;color:var(--text-soft);cursor:pointer;
  font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;padding:4px 8px;border-radius:4px;transition:all .1s}
.dropdown-clear:hover{color:var(--danger);background:var(--danger-soft)}
.dropdown-clear:disabled{opacity:.35;cursor:default}
.dropdown-info{color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums;
  font-family:var(--font-display);font-weight:600}

.search-row{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border)}
#search{flex:1;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;color:var(--text-primary);font-family:var(--font-mono);font-size:13px;
  transition:border-color .15s,box-shadow .15s}
#search:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-mid)}
.clear-filters{background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text-soft);font-family:var(--font-display);font-size:11px;font-weight:700;
  padding:10px 14px;cursor:pointer;transition:all .15s;letter-spacing:.04em;text-transform:uppercase}
.clear-filters:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.clear-filters[hidden]{display:none}

.charts-grid{display:grid;gap:14px;margin-bottom:18px;grid-template-columns:minmax(280px,1.1fr) minmax(280px,1fr)}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut-svg{flex-shrink:0}
.donut-center{font-family:var(--font-display);font-weight:800;fill:var(--text-primary);font-size:22px;letter-spacing:-.02em}
.donut-center-label{fill:var(--text-muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;font-family:var(--font-display)}
.legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;
  font-size:12px;cursor:pointer;padding:6px 10px;border-radius:var(--r-sm);transition:background .12s;user-select:none}
.legend-row:hover{background:var(--bg-elev)}
.legend-row.selected{background:var(--accent-soft)}
.legend-row.dimmed{opacity:.4}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend-label{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-value{color:var(--text-soft);font-weight:700;font-variant-numeric:tabular-nums}

.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr minmax(70px,auto);gap:10px;
  align-items:center;padding:5px 8px;border-radius:var(--r-sm);cursor:pointer;user-select:none;
  transition:background .12s}
.bar-row:hover{background:var(--bg-elev)}
.bar-row.selected{background:var(--accent-soft)}
.bar-row.dimmed{opacity:.4}
.bar-name{color:var(--text-primary);font-weight:600;font-size:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display)}
.bar-track{height:10px;background:var(--bg-elev);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);background:var(--accent)}
.bar-value{text-align:right;font-family:var(--font-display);font-size:12px;font-weight:800;
  color:var(--text-primary);font-variant-numeric:tabular-nums}

.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;
  padding:12px 16px;background:var(--accent-soft);border:1px solid var(--accent-mid);
  border-radius:var(--r);animation:slideUp .25s ease both}
.active-filters-label{font-family:var(--font-display);font-size:11px;font-weight:700;
  color:var(--accent-dark);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
.active-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;
  background:var(--bg-card);border:1px solid var(--accent);border-radius:999px;font-size:11px;
  font-family:var(--font-mono);color:var(--accent-dark);font-weight:600;cursor:default}
.active-tag .tag-group{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);font-family:var(--font-display)}
.active-tag .tag-remove{display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;background:var(--accent-mid);color:var(--accent-dark);
  font-size:10px;cursor:pointer;transition:all .12s;border:none;font-weight:700;padding:0;line-height:1}
.active-tag .tag-remove:hover{background:var(--danger);color:#fff}

.row-count{font-size:11px;color:var(--text-muted);margin-bottom:10px;letter-spacing:.04em;padding:0 4px}
.row-count strong{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.table-wrap{width:100%;overflow:auto;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh}
table{width:100%;border-collapse:collapse;min-width:900px}
thead tr{background:var(--bg-subtle);position:sticky;top:0;z-index:2}
th{padding:12px 14px;text-align:left;font-family:var(--font-display);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);border-bottom:2px solid var(--border);
  white-space:nowrap;user-select:none;cursor:pointer;transition:background .12s,color .12s}
th:hover{background:var(--bg-elev);color:var(--accent)}
th:not(:last-child){border-right:1px solid var(--border)}
th .sort-ind{display:inline-block;margin-left:6px;color:var(--text-muted);font-size:9px}
th.sorted,th.sorted .sort-ind{color:var(--accent)}
th.numeric{text-align:right}
tbody tr{transition:background .1s;border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:var(--bg-subtle)}
tbody tr:hover{background:var(--accent-soft)}
td{padding:10px 14px;color:var(--text-primary);white-space:nowrap;max-width:320px;overflow:hidden;
  text-overflow:ellipsis;font-size:12px}
td:not(:last-child){border-right:1px solid var(--border)}
td.row-num{color:var(--text-muted);font-size:11px;min-width:36px;text-align:right;user-select:none}
td.numeric{text-align:right;font-variant-numeric:tabular-nums}
td.td-wrap{white-space:normal;overflow:visible;text-overflow:clip;max-width:420px;min-width:280px;line-height:1.4}
.status-badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--bg-elev);color:var(--text-secondary)}
.status-badge.pos{background:var(--success-soft);color:#065f46}
.status-badge.info{background:var(--info-soft);color:#1d4ed8}
.status-badge.warn{background:var(--warn-soft);color:#92400e}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:32px;margin-bottom:10px}
footer{margin-top:28px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:.05em;position:relative}
.foot-toggle{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.foot-toggle:hover{color:var(--text-primary)}
.foot-districts-list{display:none;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
  margin-bottom:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);
  box-shadow:var(--shadow);padding:10px 14px;font-size:11px;letter-spacing:normal;text-align:left;
  min-width:280px;max-height:320px;overflow-y:auto;z-index:50}
.foot-districts-list.open{display:block}
.foot-districts-list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:6px 0;
  border-bottom:1px solid var(--border)}
.foot-districts-list .row:last-child{border-bottom:none}
.foot-districts-list .dlabel{color:var(--text-primary);font-weight:700}
.foot-districts-list .dfile{color:var(--text-muted);font-family:var(--font-mono,monospace)}
.foot-districts-list .dcount{color:var(--text-muted);text-align:right;white-space:nowrap}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi-card,.card{animation:slideUp .35s ease both}
@media(max-width:700px){header.top{flex-direction:column;align-items:flex-start}.meta{gap:10px}
  .dropdown-trigger{min-width:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="title-block">
      <div class="eyebrow">Министерство строительного комплекса Московской области</div>
      <h1>Расселение <span>аварийного фонда</span></h1>
    </div>
    <div class="meta">
      <input type="file" id="file-input" accept=".xlsx,.xls" multiple style="display:none" />
      <div class="btn-row">
        <button class="btn btn-danger" id="reset-btn">✕ Сбросить</button>
        <button class="btn btn-success" id="excel-btn">⬇ Excel</button>
        <button class="btn" id="token-btn">🔑 Настроить доступ</button>
        <button class="btn btn-accent" id="upload-btn">⬆ Загрузить эксель</button>
      </div>
    </div>
  </header>

  <div id="error-bar"><span>⚠</span><span id="error-msg">Ошибка загрузки данных</span></div>

  <section class="kpi-grid" id="kpi-grid"></section>

  <section class="card filter-panel">
    <div class="filter-row-main" id="filter-row">
      <span class="filter-section-label">Фильтры</span>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="🔍  Поиск по таблице…" autocomplete="off" />
      <button class="clear-filters" id="clear-filters" hidden>× Сбросить всё</button>
    </div>
  </section>

  <section class="charts-grid" id="charts-grid"></section>

  <div id="active-filters"></div>
  <div class="row-count" id="row-count"></div>
  <div class="table-wrap" id="table-wrap">
    <table id="data-table"><thead id="table-head"></thead>
      <tbody id="table-body"><tr><td colspan="999"><div class="empty-state"><div class="icon">⌛</div><div>Загрузка данных…</div></div></td></tr></tbody>
    </table>
  </div>

  <footer>Источник: Excel-файлы округов, сохраняются в GitHub-репозитории <a href="https://github.com/georgedzhanaev-eng/RASSELENIE" target="_blank" rel="noopener">RASSELENIE</a> (видно всем) · <span id="foot-districts-toggle" class="foot-toggle">Округов загружено: <span id="foot-district-count">—</span> ▾</span>
    <div id="foot-districts-list" class="foot-districts-list"></div>
  </footer>
</div>

<script>
// ============ ХРАНИЛИЩЕ (данные грузятся из Excel-файлов, не с Google Таблиц) ============
// У каждого округа — свой Excel-файл. Загрузили новый файл по округу — данные этого
// округа заменяются в общем файле data/all.json в GitHub-репозитории — их видят ВСЕ,
// кто открывает дашборд (не только тот браузер, с которого загрузили).
const GH_OWNER='georgedzhanaev-eng';
const GH_REPO='RASSELENIE';
const GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const DATA_PATH='data/all.json';
const TOKEN_KEY='rsdash_gh_token_v1';
let GH_BRANCH='main'; // если в репозитории ветка master — подхватится сама при первом чтении

function utf8ToBase64(str){return btoa(unescape(encodeURIComponent(str)))}
function base64ToUtf8(b64){return decodeURIComponent(escape(atob(b64)))}

function getToken(){return localStorage.getItem(TOKEN_KEY)||''}
function ensureToken(){
  let t=getToken();
  if(!t){
    t=(prompt('Вставьте GitHub-токен для загрузки файлов\n(fine-grained PAT, права — Contents: Read and write, только для репозитория '+GH_OWNER+'/'+GH_REPO+'):')||'').trim();
    if(t)localStorage.setItem(TOKEN_KEY,t);
  }
  return t;
}
function updateTokenBtn(){
  const btn=$('token-btn');
  if(!btn)return;
  btn.textContent=getToken()?'🔑 Токен сохранён':'🔑 Настроить доступ';
}

// Текущее содержимое data/all.json в репозитории (читаем как обычный файл через raw.githubusercontent.com —
// это просто статика, без лимитов API, доступно всем без токена).
async function fetchAllData(){
  for(const branch of[GH_BRANCH,'main','master']){
    try{
      const res=await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${branch}/${DATA_PATH}?_=${Date.now()}`,{cache:'no-store'});
      if(res.ok){GH_BRANCH=branch;return await res.json()}
      if(res.status!==404)throw new Error('HTTP '+res.status);
    }catch(e){if(branch==='master')throw e}
  }
  return{}; // файла ещё нет в репозитории — это первая загрузка
}

// sha текущей версии файла в репозитории — нужен GitHub API, чтобы понять,
// создаём файл впервые или обновляем существующий.
async function ghGetSha(token){
  const res=await fetch(`${GH_API}/contents/${DATA_PATH}`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});
  if(res.status===404)return null;
  if(!res.ok)throw new Error('Не удалось проверить файл в репозитории (HTTP '+res.status+')');
  return(await res.json()).sha;
}

// Записывает data/all.json в репозиторий — это и есть "загрузка", которую видят все.
async function ghPutAllData(allData,message,token){
  const sha=await ghGetSha(token);
  const body={message,content:utf8ToBase64(JSON.stringify(allData)),branch:GH_BRANCH};
  if(sha)body.sha=sha;
  const res=await fetch(`${GH_API}/contents/${DATA_PATH}`,{
    method:'PUT',
    headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    if(res.status===401)throw new Error('Токен не принят — проверьте, что он не истёк и выдан для этого репозитория');
    if(res.status===409)throw new Error('Кто-то успел изменить данные параллельно — попробуйте загрузить файл ещё раз');
    throw new Error(err.message||('HTTP '+res.status));
  }
}

// Пытается определить населённый пункт из адреса, если в файле нет отдельной колонки
// (например, в сырых выгрузках АИС нас. пункт отдельно не указан, только в адресе).
// "Городской округ Коломна" / "Муниципальный район ..." -> "Коломна" — чтобы округ,
// определённый автоматически из разных форматов выгрузок, назывался одинаково
// и данные не задваивались под разными ключами.
function normalizeDistrictLabel(s){
  return String(s||'').replace(/^(городской округ|муниципальный район|г\.?\s?о\.?)\s+/i,'').trim();
}
// Умный ключ адреса для сопоставления "дом из списка домов" <-> "квартира из квартирографии":
// сравнивает только улицу+номер дома, игнорируя всё, что стоит перед ними (область/округ/
// населённый пункт) — так что не важно, есть ли в одном из адресов префикс вроде
// "обл. Московская, г. Ступино," а в другом нет.
const STREET_TYPE_PREFIX=/^(ул\.?|улица|пр-кт\.?|проспект|пр-д\.?|проезд\.?|пер\.?|переулок|кв-л\.?|квартал|б-р\.?|бульвар|ш\.?|шоссе|пгт\.?|рп\.?|пос\.?|п\.?|с\.?|село|д\.?|дер\.?|г\.?|город)\s+/i;
const STREET_TYPE_SUFFIX=/\s+(проспект|улица|переулок|проезд|квартал|бульвар|шоссе)$/i;
function cleanStreetToken(raw){
  let s=raw.trim();
  s=s.replace(STREET_TYPE_PREFIX,'').trim();
  s=s.replace(STREET_TYPE_SUFFIX,'').trim();
  return s.toLowerCase().replace(/[^а-яё0-9]/g,'');
}
function addressKey(address){
  const s=String(address||'').toLowerCase().replace(/ё/g,'е').trim();
  const parts=s.split(',').map(p=>p.trim());
  let house='',houseIdx=null;
  for(let i=0;i<parts.length;i++){
    const m=parts[i].match(/^д\.?\s*([0-9][0-9a-zа-я/]*)\s*$/i);
    if(m){house=m[1];houseIdx=i;break}
  }
  let streetRaw;
  if(houseIdx==null){
    const mh=s.match(/д\.?\s*([0-9][0-9a-zа-я/]*)/i);
    house=mh?mh[1]:'';
    streetRaw=parts.length>=2?parts[parts.length-2]:parts[parts.length-1];
  }else{
    streetRaw=houseIdx>=1?parts[houseIdx-1]:parts[0];
  }
  return cleanStreetToken(streetRaw)+'|'+house.toLowerCase();
}
function deriveSettlement(address,district){
  if(!address)return district||'';
  const m=String(address).match(/(?:^|,\s*)(г\.|город|рп\.|п\.|пос\.|с\.|село|д\.|дер\.)\s*([А-ЯЁа-яё-]+)/);
  if(m)return m[1].replace('.','').trim()+'. '+m[2];
  return district||'';
}

// Соответствие колонок исходных таблиц каноническим полям (устойчиво к разному
// порядку столбцов в таблицах разных округов — ищем по вхождению ключевых слов).
const FIELDS=[
  {key:'num',label:'№',match:['№'],numeric:true},
  {key:'district',label:'Округ',match:['округ','наименование мр']},
  {key:'settlement',label:'Нас. пункт',match:['населенный пункт','мо дома']},
  {key:'address',label:'Адрес МКД',match:['адрес']},
  {key:'apt',label:'№ Ж/П',match:['ж/п','номер помещения','номер квартиры']},
  {key:'ownership',label:'Тип собственности',match:['собств']},
  {key:'area',label:'Площадь, м²',match:['площадь','пл. аис','пл.аис'],numeric:true},
  {key:'method',label:'Способ расселения',match:['способ расселения']},
  {key:'status',label:'Статус',match:['статус','состояние расселения']},
  {key:'object',label:'Объект расселения',match:['объект']},
  {key:'contractor',label:'Подрядчик',match:['подрядчик']},
  {key:'purchase',label:'№ закупки ЕИС',match:['закупк']},
];
const FILTERABLE=['district','settlement','status','method','ownership','contractor'];
const STATUS_COLORS={'расселено':'#059669','контракт заключен':'#2563eb','подлежит расселению':'#d97706'};
const PALETTE=['#0891b2','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#a855f7'];

const state={rows:[],filters:new Map(),search:'',sortKey:null,sortDir:'asc',lastGood:null,errors:[],houseAreaGp:new Map(),loadedDistricts:[]};

const $=id=>document.getElementById(id);
let infoHideTimer=null;
const elErrBar=$('error-bar'),elErrMsg=$('error-msg'),elKpiGrid=$('kpi-grid');
const elFilterRow=$('filter-row'),elSearch=$('search'),elClearBtn=$('clear-filters');
const elCharts=$('charts-grid');
const elActiveFilters=$('active-filters'),elRowCount=$('row-count');
const elHead=$('table-head'),elBody=$('table-body');

// ============ CSV PARSER ============
function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i],nx=t[i+1];
if(q){if(ch==='"'&&nx==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
else{if(ch==='"')q=true;else if(ch===','){r.push(c.trim());c=''}
else if(ch==='\r'&&nx==='\n'){r.push(c.trim());R.push(r);r=[];c='';i++}
else if(ch==='\n'){r.push(c.trim());R.push(r);r=[];c=''}else c+=ch}}
if(c.length||r.length){r.push(c.trim());R.push(r)}
while(R.length&&R[R.length-1].every(v=>v===''))R.pop();return R}

function toNumber(v){if(v==null||v==='')return null;const c=String(v).replace(/\s/g,'').replace(',','.');
if(!/^-?\d+(\.\d+)?$/.test(c))return null;const n=parseFloat(c);return isNaN(n)?null:n}
const norm=v=>String(v||'').toLowerCase().trim();
// Убирает путаницу между похожими латинскими и русскими буквами (частая опечатка
// при вводе в Google Таблицах — переключили раскладку на середине слова, и
// "собственности" превращается в "coбственности" с латинской "c"). Прогоняем через
// эту функцию оба конца сравнения при поиске нужного столбца, чтобы опечатка не
// ломала определение колонки.
function deLatinize(s){
  const map={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у'};
  return s.replace(/[aceopxy]/g,ch=>map[ch]);
}
const escHtml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtInt=n=>n==null?'—':new Intl.NumberFormat('ru-RU').format(n);
const fmtArea=n=>n==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
function pluralRu(n,forms){const m10=n%10,m100=n%100;
if(m10===1&&m100!==11)return forms[0];
if(m10>=2&&m10<=4&&!(m100>=12&&m100<=14))return forms[1];
return forms[2]}

function statusColor(s,fi){const n=norm(s);if(STATUS_COLORS[n])return STATUS_COLORS[n];return PALETTE[fi%PALETTE.length]}
function statusClass(s){const n=norm(s);
if(n==='расселено')return'pos';if(n==='контракт заключен')return'info';if(n==='подлежит расселению')return'warn';return''}

// Сопоставляет заголовки конкретного источника с каноническими полями FIELDS
function mapHeaders(headerRow){
  const idxOf={};const used=new Set();
  headerRow.forEach((h,i)=>{
    const lc=deLatinize(norm(h));
    for(const f of FIELDS){
      if(used.has(f.key))continue;
      if(f.match.some(m=>lc.includes(deLatinize(m)))){idxOf[f.key]=i;used.add(f.key);break}
    }
  });
  return idxOf;
}

// ============ ЗАГРУЗКА ДАННЫХ ============
// Убирает слово "собственность"/"собственности" из значений столбца, чтобы короткие
// варианты ("Частная (физ. лицо)", "Муниципальная") помещались без обрезания.
function shortenOwnership(v){
  return String(v||'').replace(/\s*собственност[ьи]\s*/gi,' ').replace(/\s+/g,' ').trim();
}

// Приводит лист Excel к тому же виду "таблица" (массив строк-массивов, 1-я строка — заголовки),
// который раньше отдавал CSV-парсер — чтобы вся остальная логика (mapHeaders и т.д.) не менялась.
function sheetToTable(ws){
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
}

// Среди всех листов книги ищет тот, что больше всего похож на квартирографию
// (есть адрес + статус/№ помещения) — так дашборд сам находит нужный лист, даже если
// в книге несколько вкладок (например, "ГП Бюджет" + "Квартирография ГП").
function parseWorkbookApartments(wb){
  let best=null;
  for(const sheetName of wb.SheetNames){
    const table=sheetToTable(wb.Sheets[sheetName]);
    if(table.length<2)continue;
    const idxOf=mapHeaders(table[0]);
    let score=0;
    if(idxOf.address!=null)score+=3;
    if(idxOf.status!=null)score+=2;
    if(idxOf.apt!=null)score+=2;
    if(idxOf.area!=null)score+=1;
    if(idxOf.method!=null)score+=1;
    if(!best||score>best.score)best={score,idxOf,table,sheetName};
  }
  if(!best||best.score<5){
    throw new Error('Не найден лист с квартирографией (нужны колонки «Адрес» и «Статус»/«№ Ж-П»)');
  }
  const {idxOf,table,sheetName}=best;
  const rows=[];
  for(let i=1;i<table.length;i++){
    const raw=table[i];
    const row={};
    for(const f of FIELDS){
      const idx=idxOf[f.key];
      let v=idx!=null?raw[idx]:'';
      if(typeof v==='string')v=v.trim();
      if(v==null)v='';
      if(f.numeric)v=toNumber(v);
      if(f.key==='ownership')v=shortenOwnership(v);
      row[f.key]=v;
    }
    if(!row.address&&!row.status)continue; // пропускаем пустые строки
    if(!row.settlement)row.settlement=deriveSettlement(row.address,row.district);
    rows.push(row);
  }
  return{rows,sheetName};
}

// Ищет среди остальных листов книги "Список домов" — по колонкам "Адрес" + что-то
// с "ГП" в названии (Площадь по ГП / Общая площадь по ГП). Не обязателен — если такого
// листа нет, площадь ГП на дашборде просто не покажется для этого округа.
function parseWorkbookHouses(wb,excludeSheetName){
  for(const sheetName of wb.SheetNames){
    if(sheetName===excludeSheetName)continue;
    const table=sheetToTable(wb.Sheets[sheetName]);
    if(table.length<2)continue;
    const header=table[0].map(h=>deLatinize(norm(h)));
    const idxAddr=header.findIndex(h=>h.includes('адрес'));
    const idxGp=header.findIndex(h=>h.includes('гп'));
    if(idxAddr<0||idxGp<0)continue;
    const map=new Map();
    for(let i=1;i<table.length;i++){
      const raw=table[i];
      let addr=raw[idxAddr];addr=(addr==null?'':String(addr)).trim();
      if(!addr||norm(addr)==='итого')continue;
      const gp=toNumber(raw[idxGp]);
      if(gp!=null)map.set(norm(addr),gp);
    }
    if(map.size)return map;
  }
  return new Map();
}

// Читает Excel-файл, определяет округ и записывает его данные в data/all.json в репозитории —
// это видят все, кто откроет дашборд, а не только этот браузер.
async function handleFileUpload(file){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const{rows,sheetName}=parseWorkbookApartments(wb);
    const houseAreaGp=parseWorkbookHouses(wb,sheetName);
    const detected=[...new Set(rows.map(r=>normalizeDistrictLabel(r.district)).filter(Boolean))];
    let label=detected.length===1?detected[0]:'';
    if(!label){
      const guess=file.name.replace(/\.(xlsx|xls)$/i,'').replace(/[_\s]+/g,' ').trim();
      label=(prompt('В файле не нашёл однозначного округа. Укажите название округа:',guess)||'').trim();
    }
    if(!label){
      elErrMsg.textContent='Файл «'+file.name+'» не загружен: не указано название округа';
      elErrBar.classList.add('visible');
      return;
    }
    const token=ensureToken();
    if(!token){
      elErrMsg.textContent='Файл «'+file.name+'» не загружен: не задан GitHub-токен';
      elErrBar.classList.add('visible');
      return;
    }
    rows.forEach(r=>{r.district=label}); // приводим к одному общему названию округа, даже если в файле оно было длиннее
    elErrBar.classList.remove('info');
    elErrMsg.textContent='Загружаю «'+file.name+'» в репозиторий…';
    elErrBar.classList.add('visible');
    const current=await fetchAllData().catch(()=>({}));
    current[label]={rows,houseAreaGp:[...houseAreaGp.entries()],fileName:file.name,uploadedAt:new Date().toISOString()};
    await ghPutAllData(current,`Обновить округ «${label}» (${file.name})`,token);
    applyAllData(current); // сразу показываем результат, не дожидаясь обновления raw.githubusercontent.com
    elErrMsg.textContent='✓ Округ «'+label+'» сохранён. У других данные обновятся в течение ~5 минут (кэш GitHub).';
    elErrBar.classList.add('visible','info');
    clearTimeout(infoHideTimer);
    infoHideTimer=setTimeout(()=>elErrBar.classList.remove('visible','info'),6000);
  }catch(err){
    clearTimeout(infoHideTimer);
    elErrBar.classList.remove('info');
    elErrMsg.textContent='Ошибка загрузки «'+file.name+'»: '+(err.message||err);
    elErrBar.classList.add('visible');
  }
}

function applyAllData(allData){
  const labels=Object.keys(allData);
  let rows=[];
  const houseAreaGp=new Map();
  labels.forEach(label=>{
    const d=allData[label];
    rows=rows.concat(d.rows||[]);
    (d.houseAreaGp||[]).forEach(([k,v])=>houseAreaGp.set(addressKey(k),v)); // addressKey ещё раз "сжимает" уже сохранённый (полный) адрес — работает и для старых, и для новых округов одинаково
  });
  state.rows=rows;state.houseAreaGp=houseAreaGp;state.lastGood=labels.length?new Date():null;
  state.loadedDistricts=labels.map(label=>({label,count:(allData[label].rows||[]).length,fileName:allData[label].fileName||'',uploadedAt:allData[label].uploadedAt}))
    .sort((a,b)=>a.label.localeCompare(b.label,'ru'));
  render();
  if(!rows.length){
    elBody.innerHTML='<tr><td colspan="999"><div class="empty-state"><div class="icon">📂</div><div>Нет загруженных данных — нажмите «⬆ Загрузить эксель» и выберите файл по округу</div></div></td></tr>';
  }
}

async function loadAll(){
  let allData={};
  try{
    allData=await fetchAllData();
  }catch(err){
    elErrMsg.textContent='Не удалось загрузить данные из репозитория: '+(err.message||err);
    elErrBar.classList.add('visible');
  }
  applyAllData(allData);
}

async function removeDistrictRemote(label){
  const token=ensureToken();
  if(!token)return;
  try{
    const current=await fetchAllData();
    delete current[label];
    await ghPutAllData(current,`Удалить округ «${label}»`,token);
    applyAllData(current);
  }catch(err){
    elErrMsg.textContent='Не удалось удалить округ «'+label+'»: '+(err.message||err);
    elErrBar.classList.add('visible');
  }
}

// ============ ФИЛЬТРАЦИЯ / СОРТИРОВКА ============
function applyFilters(rows,exceptKey=null){
  const q=state.search.toLowerCase().trim();
  return rows.filter(r=>{
    for(const[key,set]of state.filters){
      if(key===exceptKey)continue;
      const v=(r[key]==null||r[key]==='')?'—':String(r[key]);
      if(!set.has(v))return false;
    }
    if(q){
      const hay=FIELDS.map(f=>String(r[f.key]==null?'':r[f.key])).join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}
function applySort(rows){
  if(!state.sortKey)return rows;
  const f=FIELDS.find(f=>f.key===state.sortKey);
  const sign=state.sortDir==='asc'?1:-1;
  return[...rows].sort((a,b)=>{
    const va=a[state.sortKey],vb=b[state.sortKey];
    if(f&&f.numeric){
      if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return-1;
      return(va-vb)*sign;
    }
    return String(va||'').localeCompare(String(vb||''),'ru')*sign;
  });
}
function toggleFilter(key,value){
  if(!state.filters.has(key))state.filters.set(key,new Set());
  const set=state.filters.get(key);
  if(set.has(value))set.delete(value);else set.add(value);
  if(set.size===0)state.filters.delete(key);
  render();
}
function clearAllFilters(){state.filters.clear();state.search='';elSearch.value='';closeAllDropdowns();render()}

// ============ РЕНДЕР: KPI ============
const KNOWN_STATUSES=new Set(['расселено','контракт заключен','подлежит расселению']);
const UNFORESEEN_STATUSES=new Set(['суд','розыск','запрет','наследство','сво']);
const STATUS_GROUPS={
  resettled:n=>n==='расселено',
  pending:n=>n==='подлежит расселению',
  contracted:n=>n==='контракт заключен',
  unforeseen:n=>UNFORESEEN_STATUSES.has(n),
  other:n=>!KNOWN_STATUSES.has(n)&&!UNFORESEEN_STATUSES.has(n),
};
function statusValuesForGroup(key){
  const pred=STATUS_GROUPS[key];
  return[...new Set(state.rows.map(r=>r.status).filter(v=>v!=null&&v!==''))].filter(v=>pred(norm(v)));
}
function isGroupActive(key){
  const values=statusValuesForGroup(key);
  const current=state.filters.get('status');
  if(!current||!values.length)return false;
  return values.length===current.size&&values.every(v=>current.has(v));
}
function toggleStatusGroup(key){
  const values=statusValuesForGroup(key);
  if(!values.length)return;
  if(isGroupActive(key))state.filters.delete('status');
  else state.filters.set('status',new Set(values));
  render();
}
function renderKPI(filtered){
  const total=filtered.length;
  const count=st=>filtered.filter(r=>norm(r.status)===st).length;
  const areaOf=st=>filtered.filter(r=>norm(r.status)===st).reduce((s,r)=>s+(r.area||0),0);
  const resettled=count('расселено'),contracted=count('контракт заключен'),pending=count('подлежит расселению');
  const areaResettled=areaOf('расселено'),areaContracted=areaOf('контракт заключен'),areaPending=areaOf('подлежит расселению');
  const otherRows=filtered.filter(r=>{const n=norm(r.status);return!KNOWN_STATUSES.has(n)&&!UNFORESEEN_STATUSES.has(n)});
  const other=otherRows.length;
  const areaOther=otherRows.reduce((s,r)=>s+(r.area||0),0);
  const unforeseenRows=filtered.filter(r=>UNFORESEEN_STATUSES.has(norm(r.status)));
  const unforeseen=unforeseenRows.length;
  const areaUnforeseen=unforeseenRows.reduce((s,r)=>s+(r.area||0),0);
  const buildings=new Set(filtered.map(r=>r.address).filter(Boolean)).size;
  const districts=new Set(filtered.map(r=>r.district).filter(Boolean)).size;
  const area=filtered.reduce((s,r)=>s+(r.area||0),0);
  const gpAddresses=new Set(filtered.map(r=>r.address).filter(Boolean));
  let areaGp=0;
  gpAddresses.forEach(addr=>{const v=state.houseAreaGp.get(addressKey(addr));if(v!=null)areaGp+=v});
  const pct=n=>total?Math.round(n/total*100):0;
  const cards=[
    {label:'Площадь АИС',value:fmtArea(area),unit:'м²',color:'var(--accent)'},
    {label:'Площадь ГП',value:fmtArea(areaGp),unit:'м²',color:'var(--accent-dark)'},
    {label:'Округа',value:fmtInt(districts),color:'var(--accent)'},
    {label:'Дома',value:fmtInt(buildings),color:'var(--accent)'},
    {label:'Жилые помещения',value:fmtInt(total),color:'var(--accent)'},
    {label:'Расселено',value:fmtInt(resettled),unit:'шт.',value2:fmtArea(areaResettled),unit2:'м²',color:'var(--success)',group:'resettled'},
    {label:'Не расселено',value:fmtInt(pending),unit:'шт.',value2:fmtArea(areaPending),unit2:'м²',color:'var(--warn)',group:'pending'},
    {label:'Контракт заключён',value:fmtInt(contracted),unit:'шт.',value2:fmtArea(areaContracted),unit2:'м²',color:'var(--info)',group:'contracted'},
    {label:'Иные обязательства',value:fmtInt(other),unit:'шт.',value2:fmtArea(areaOther),unit2:'м²',color:'#7c3aed',group:'other'},
    {label:'Непредвиденные обстоятельства',value:fmtInt(unforeseen),unit:'шт.',value2:fmtArea(areaUnforeseen),unit2:'м²',color:'#dc2626',group:'unforeseen',tightPad:true},
  ];
  elKpiGrid.innerHTML=cards.map(c=>{
    const active=c.group&&isGroupActive(c.group);
    return`<div class="kpi-card${c.group?' clickable':''}${active?' active':''}${c.tightPad?' tight':''}" style="--c-accent:${c.color}"${c.group?` data-group="${c.group}"`:''}>
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}${c.unit?`<span class="kpi-unit">${c.unit}</span>`:''}</div>
      ${c.value2?`<div class="kpi-value kpi-value2">${c.value2}${c.unit2?`<span class="kpi-unit">${c.unit2}</span>`:''}</div>`:''}
      ${c.sub?`<div class="kpi-sub">${c.sub}</div>`:''}
    </div>`;
  }).join('');
  $('foot-district-count').textContent=districts||'—';
}

// ============ РЕНДЕР: ФИЛЬТРЫ (dropdown) ============
function optionsFor(key){
  const others=applyFilters(state.rows,key);
  const counts=new Map();
  others.forEach(r=>{const v=(r[key]==null||r[key]==='')?'—':String(r[key]);counts.set(v,(counts.get(v)||0)+1)});
  return[...counts.entries()].sort((a,b)=>b[1]-a[1]);
}
function renderFilters(){
  const fieldMeta=Object.fromEntries(FIELDS.map(f=>[f.key,f]));
  elFilterRow.innerHTML='<span class="filter-section-label">Фильтры</span>'+FILTERABLE.map(key=>{
    const label=fieldMeta[key].label;
    const active=state.filters.get(key);
    const count=active?active.size:0;
    return`<div class="dropdown${count?' has-selection':''}" data-key="${key}">
      <div class="dropdown-trigger">
        <span class="dropdown-label-wrap"><span class="dropdown-label-text">${label}</span></span>
        <span class="dropdown-badge" ${count?'':'hidden'}>${count}</span>
        <span class="dropdown-arrow">▾</span>
      </div>
      <div class="dropdown-panel">
        <div class="dropdown-search"><input type="text" placeholder="Поиск…" data-filter-search /></div>
        <div class="dropdown-options"></div>
        <div class="dropdown-footer">
          <button class="dropdown-clear" ${count?'':'disabled'} data-clear>Сбросить</button>
          <span class="dropdown-info">${count} выбрано</span>
        </div>
      </div>
    </div>`;
  }).join('');
  elClearBtn.hidden=state.filters.size===0&&!state.search;
}
function renderDropdownOptions(dropdownEl,key,filterText){
  const opts=optionsFor(key).filter(([v])=>!filterText||v.toLowerCase().includes(filterText.toLowerCase()));
  const active=state.filters.get(key)||new Set();
  const optWrap=dropdownEl.querySelector('.dropdown-options');
  if(!opts.length){optWrap.innerHTML='<div class="dropdown-empty">Ничего не найдено</div>';return}
  optWrap.innerHTML=opts.map(([v,c])=>`
    <div class="dropdown-option${active.has(v)?' selected':''}" data-value="${escHtml(v)}">
      <span class="checkmark">${active.has(v)?'✓':''}</span>
      <span class="label">${escHtml(v)}</span>
      <span class="count">${c}</span>
    </div>`).join('');
}
function closeAllDropdowns(){document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'))}
elFilterRow.addEventListener('click',e=>{
  const dd=e.target.closest('.dropdown');
  const trigger=e.target.closest('.dropdown-trigger');
  const opt=e.target.closest('.dropdown-option');
  const clearBtn=e.target.closest('[data-clear]');
  if(trigger){
    const wasOpen=dd.classList.contains('open');
    closeAllDropdowns();
    if(!wasOpen){dd.classList.add('open');renderDropdownOptions(dd,dd.dataset.key,'')}
    return;
  }
  if(opt){toggleFilter(dd.dataset.key,opt.dataset.value);
    // держим открытым и перерисовываем панель с актуальными счётчиками
    requestAnimationFrame(()=>{const ndd=document.querySelector(`.dropdown[data-key="${dd.dataset.key}"]`);
      if(ndd){ndd.classList.add('open');renderDropdownOptions(ndd,dd.dataset.key,ndd.querySelector('[data-filter-search]').value)}});
    return;
  }
  if(clearBtn){state.filters.delete(dd.dataset.key);render();
    requestAnimationFrame(()=>{const ndd=document.querySelector(`.dropdown[data-key="${dd.dataset.key}"]`);
      if(ndd){ndd.classList.add('open');renderDropdownOptions(ndd,dd.dataset.key,'')}});
    return;
  }
});
elFilterRow.addEventListener('input',e=>{
  if(e.target.matches('[data-filter-search]')){
    const dd=e.target.closest('.dropdown');
    renderDropdownOptions(dd,dd.dataset.key,e.target.value);
  }
});
document.addEventListener('click',e=>{if(!e.target.closest('.dropdown'))closeAllDropdowns()});

// ============ РЕНДЕР: ГРАФИКИ ============
function renderDonut(filtered){
  const counts=new Map();
  filtered.forEach(r=>{const s=r.status||'—';counts.set(s,(counts.get(s)||0)+1)});
  const entries=[...counts.entries()].sort((a,b)=>b[1]-a[1]);
  const total=filtered.length||1;
  const R=54,C=2*Math.PI*R;
  let offset=0;
  const activeSet=state.filters.get('status');
  const segs=entries.map(([s,c],i)=>{
    const color=statusColor(s,i);
    const frac=c/total;
    const dash=frac*C;
    const dimmed=activeSet&&activeSet.size&&!activeSet.has(s);
    const seg=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${color}" stroke-width="18"
      stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" opacity="${dimmed?0.25:1}"
      transform="rotate(-90 70 70)" />`;
    offset+=dash;
    return seg;
  }).join('');
  const legend=entries.map(([s,c],i)=>{
    const color=statusColor(s,i);
    const sel=activeSet&&activeSet.has(s);
    const dimmed=activeSet&&activeSet.size&&!sel;
    return`<div class="legend-row${sel?' selected':''}${dimmed?' dimmed':''}" data-status="${escHtml(s)}">
      <span class="legend-swatch" style="background:${color}"></span>
      <span class="legend-label">${escHtml(s)}</span>
      <span class="legend-value">${c} · ${Math.round(c/total*100)}%</span>
    </div>`;
  }).join('');
  elCharts.innerHTML=`
    <div class="card">
      <div class="card-title"><span class="em">●</span>Распределение по статусу</div>
      <div class="donut-wrap">
        <svg class="donut-svg" width="140" height="140" viewBox="0 0 140 140">
          ${segs}
          <text x="70" y="66" text-anchor="middle" class="donut-center">${fmtInt(filtered.length)}</text>
          <text x="70" y="82" text-anchor="middle" class="donut-center-label">квартир</text>
        </svg>
        <div class="legend">${legend||'<div class="dropdown-empty">Нет данных</div>'}</div>
      </div>
    </div>
    <div class="card" id="method-card">
      <div class="card-title"><span class="em">●</span>Способ расселения</div>
      <div class="bar-list" id="method-bars"></div>
    </div>`;
  elCharts.querySelectorAll('.legend-row').forEach(row=>{
    row.addEventListener('click',()=>toggleFilter('status',row.dataset.status));
  });
  renderMethodBars(filtered);
}
function renderMethodBars(filtered){
  const counts=new Map();
  filtered.forEach(r=>{
    const val=(r.method==null||r.method==='')?'—':r.method; // тот же placeholder, что использует общий механизм фильтров
    counts.set(val,(counts.get(val)||0)+1);
  });
  const entries=[...counts.entries()].sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...entries.map(e=>e[1]));
  const activeSet=state.filters.get('method');
  $('method-bars').innerHTML=entries.map(([val,c])=>{
    const label=val==='—'?'Не указан':val;
    const sel=activeSet&&activeSet.has(val);
    const dimmed=activeSet&&activeSet.size&&!sel;
    return`<div class="bar-row${sel?' selected':''}${dimmed?' dimmed':''}" data-method="${escHtml(val)}">
      <div class="bar-name">${escHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c/max*100).toFixed(1)}%"></div></div>
      <div class="bar-value">${c}</div>
    </div>`;
  }).join('')||'<div class="dropdown-empty">Нет данных</div>';
  $('method-bars').querySelectorAll('.bar-row[data-method]').forEach(row=>{
    row.addEventListener('click',()=>toggleFilter('method',row.dataset.method));
  });
}

// ============ РЕНДЕР: АКТИВНЫЕ ФИЛЬТРЫ ============
function renderActiveFilters(){
  const fieldMeta=Object.fromEntries(FIELDS.map(f=>[f.key,f]));
  if(state.filters.size===0){elActiveFilters.innerHTML='';return}
  let html='<div class="active-filters"><span class="active-filters-label">Активные фильтры:</span>';
  for(const[key,set]of state.filters){
    for(const v of set){
      html+=`<span class="active-tag"><span class="tag-group">${fieldMeta[key].label}</span>${escHtml(v)}
        <button class="tag-remove" data-key="${key}" data-value="${escHtml(v)}">×</button></span>`;
    }
  }
  html+='</div>';
  elActiveFilters.innerHTML=html;
  elActiveFilters.querySelectorAll('.tag-remove').forEach(btn=>{
    btn.addEventListener('click',()=>toggleFilter(btn.dataset.key,btn.dataset.value));
  });
}

// ============ РЕНДЕР: ТАБЛИЦА ============
const TABLE_FIELDS=['address','apt','ownership','area','method','status','object','contractor','purchase'];
function renderTable(filtered){
  const fieldMeta=Object.fromEntries(FIELDS.map(f=>[f.key,f]));
  elHead.innerHTML='<tr><th>№</th>'+TABLE_FIELDS.map(key=>{
    const f=fieldMeta[key];
    const sorted=state.sortKey===key;
    return`<th class="${f.numeric?'numeric':''}${sorted?' sorted':''}" data-key="${key}">${f.label}
      <span class="sort-ind">${sorted?(state.sortDir==='asc'?'▲':'▼'):'↕'}</span></th>`;
  }).join('')+'</tr>';
  const sorted=applySort(filtered);
  if(!sorted.length){
    elBody.innerHTML='<tr><td colspan="999"><div class="empty-state"><div class="icon">🔍</div><div>Ничего не найдено по заданным фильтрам</div></div></td></tr>';
  }else{
    elBody.innerHTML=sorted.map((r,i)=>{
      const cells=TABLE_FIELDS.map(key=>{
        const f=fieldMeta[key];
        if(key==='status'){
          const cls=statusClass(r.status);
          return`<td><span class="status-badge${cls?' '+cls:''}">${escHtml(r.status||'—')}</span></td>`;
        }
        if(f.numeric)return`<td class="numeric">${r[key]==null?'—':fmtArea(r[key])}</td>`;
        if(key==='address')return`<td class="td-wrap">${escHtml(r[key]||'—')}</td>`;
        return`<td title="${escHtml(r[key]||'')}">${escHtml(r[key]||'—')}</td>`;
      }).join('');
      return`<tr><td class="row-num">${i+1}</td>${cells}</tr>`;
    }).join('');
  }
  elRowCount.innerHTML=`Показано <strong>${fmtInt(sorted.length)}</strong> из <strong>${fmtInt(state.rows.length)}</strong> ${pluralRu(state.rows.length,['строка','строки','строк'])}`;
}
elHead.addEventListener('click',e=>{
  const th=e.target.closest('th');if(!th)return;
  const key=th.dataset.key;if(!key)return;
  if(state.sortKey===key)state.sortDir=state.sortDir==='asc'?'desc':'asc';
  else{state.sortKey=key;state.sortDir='asc'}
  render();
});

// ============ ГЛАВНЫЙ РЕНДЕР ============
function render(){
  const filtered=applyFilters(state.rows);
  renderKPI(filtered);
  renderFilters();
  renderDonut(filtered);
  renderActiveFilters();
  renderTable(filtered);
}

// ============ EXPORT / КНОПКИ ============
elKpiGrid.addEventListener('click',e=>{
  const card=e.target.closest('.kpi-card[data-group]');
  if(card)toggleStatusGroup(card.dataset.group);
});
$('reset-btn').addEventListener('click',clearAllFilters);
$('upload-btn').addEventListener('click',()=>$('file-input').click());
$('token-btn').addEventListener('click',()=>{
  const cur=getToken();
  const t=(prompt('GitHub-токен для загрузки файлов\n(fine-grained PAT, права — Contents: Read and write, только для репозитория '+GH_OWNER+'/'+GH_REPO+').\nОставьте пустым и нажмите OK, чтобы удалить сохранённый токен из этого браузера:',cur)||'').trim();
  if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);
  updateTokenBtn();
});
updateTokenBtn();
$('file-input').addEventListener('change',async e=>{
  const files=[...e.target.files];
  for(const f of files)await handleFileUpload(f); // по одному — иначе несколько prompt() наложатся друг на друга
  e.target.value='';
});
elSearch.addEventListener('input',()=>{state.search=elSearch.value;render()});

$('foot-districts-toggle').addEventListener('click',e=>{
  const list=$('foot-districts-list');
  if(list.classList.contains('open')){list.classList.remove('open');return}
  list.innerHTML=state.loadedDistricts.length
    ?state.loadedDistricts.map(d=>{
      const dt=new Date(d.uploadedAt);
      const dtStr=isNaN(dt)?'':dt.toLocaleDateString('ru-RU');
      return`<div class="row"><span><b class="dlabel">${escHtml(d.label)}</b><br><span class="dfile">${escHtml(d.fileName||'—')}</span></span><span class="dcount">${fmtInt(d.count)} стр.${dtStr?'<br>'+dtStr:''}</span></div>`;
    }).join('')
    :'<div class="row">Округа не загружены</div>';
  list.classList.add('open');
  e.stopPropagation();
});
document.addEventListener('click',()=>$('foot-districts-list').classList.remove('open'));
$('foot-districts-list').addEventListener('click',e=>e.stopPropagation());
elClearBtn.addEventListener('click',clearAllFilters);
$('excel-btn').addEventListener('click',()=>{
  const fieldMeta=Object.fromEntries(FIELDS.map(f=>[f.key,f]));
  const filtered=applySort(applyFilters(state.rows));
  const data=filtered.map(r=>{
    const o={};TABLE_FIELDS.forEach(key=>{o[fieldMeta[key].label]=r[key]==null?'':r[key]});return o;
  });
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Расселение');
  XLSX.writeFile(wb,`Расселение_${new Date().toISOString().slice(0,10)}.xlsx`);
});

// ============ СТАРТ ============
loadAll();
</script>
